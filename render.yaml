services:
  - type: web
    name: gustavix
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PARENT_PIN_DEFAULT
        value: "1234"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
